    <!-- Deliberately no title/description/canonical/OG/Twitter tags here.
         This is a client-only SPA (react-helmet-async, no SSR/prerender) —
         every route sets these itself via the Seo component. Duplicating
         them here would create a second, static instance of each tag that
         Helmet has no way to remove (it only manages tags it rendered
         itself), and browsers/crawlers resolve conflicting canonical/
         description tags by picking whichever comes first in the DOM —
         i.e. this static one would win over the correct per-page one on
         every route. See MEMORY.md / project notes on prerendering if a
         truly route-correct snapshot is ever needed for non-JS crawlers
         (most social-share unfurlers execute JS-rendered previews via
         their own fetchers, so this mainly affects legacy/basic bots). -->
    <title>TOTAL MEDIA</title>
